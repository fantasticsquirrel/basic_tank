[platformio]
default_envs = esp32dev

[env]
lib_ldf_mode = deep+

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++17
build_src_filter = +<navigation.cpp>
